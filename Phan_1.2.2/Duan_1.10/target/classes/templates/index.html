<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Captcha ngẫu nhiên</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f4f8; margin: 0; padding: 40px 16px; }
        .card { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 10px;
                box-shadow: 0 2px 10px rgba(0, 0, 0, .1); padding: 28px; text-align: center; }
        h1 { font-size: 22px; margin-top: 0; }
        .captcha { border: 1px solid #ccc; border-radius: 6px; max-width: 100%; }
        .meta { color: #666; font-size: 14px; margin: 8px 0 20px; }
        input[type=text] { font-size: 18px; padding: 8px; width: 160px; text-transform: uppercase; letter-spacing: 2px; }
        button, .btn { font-size: 16px; padding: 8px 16px; border: none; border-radius: 6px;
                       background: #2563eb; color: #fff; cursor: pointer; text-decoration: none; }
        .btn.secondary { background: #6b7280; display: inline-block; margin-top: 16px; }
        .result { padding: 10px; border-radius: 6px; margin-bottom: 16px; }
        .result.ok { background: #dcfce7; color: #166534; }
        .result.fail { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
<div class="card">
    <h1>Captcha ngẫu nhiên</h1>

    <!-- Kết quả lần kiểm tra trước (flash attribute, chỉ hiện một lần) -->
    <div th:if="${ok != null}" class="result" th:classappend="${ok} ? 'ok' : 'fail'">
        <span th:if="${ok}">✔ Đúng! Bạn đã nhập "<b th:text="${answer}"></b>".</span>
        <span th:unless="${ok}">✘ Sai. Bạn đã nhập "<b th:text="${answer}"></b>". Hãy thử hình mới.</span>
    </div>

    <img class="captcha" th:src="@{${imageUrl}}" alt="captcha" width="220" height="80">
    <p class="meta">Hình số <b th:text="${index}">1</b> / <span th:text="${total}">20</span></p>

    <form th:action="@{/verify}" method="post">
        <input type="text" name="answer" maxlength="6" placeholder="Nhập mã" autocomplete="off" required autofocus>
        <button type="submit">Kiểm tra</button>
    </form>

    <a class="btn secondary" th:href="@{/}">↻ Đổi hình khác</a>
</div>
</body>
</html>
