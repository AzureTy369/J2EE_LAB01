spring.application.name=duan-1-7
server.port=8081

# Actuator: các endpoint theo dõi vận hành được mở qua HTTP
management.endpoints.web.exposure.include=health,info,beans,mappings,metrics,shutdown
management.endpoint.health.show-details=always
# Cho phép tắt ứng dụng bằng POST /actuator/shutdown (mặc định bị tắt)
management.endpoint.shutdown.access=unrestricted
