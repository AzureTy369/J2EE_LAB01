spring.application.name=Bootstrap Spring Boot
server.port=8082

# Thymeleaf: tắt cache để sửa HTML xong chỉ cần refresh trình duyệt
spring.thymeleaf.cache=false

# Cơ sở dữ liệu H2 trong bộ nhớ (mất dữ liệu khi tắt ứng dụng)
spring.datasource.url=jdbc:h2:mem:bootapp;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Hibernate tự tạo bảng từ các @Entity
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# Chạy data.sql sau khi Hibernate tạo bảng xong
spring.jpa.defer-datasource-initialization=true

# Trang quản trị CSDL: http://localhost:8082/h2-console
spring.h2.console.enabled=true
